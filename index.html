<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#92182a">
<title>GEORPAU Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@400;600;700&family=Instrument+Serif:ital@0;1&family=Italiana&family=Nothing+You+Could+Do&display=swap">
<style>
/* Layout: a locked magazine. Gate -> cover -> live counter -> illustrated map (Mediterranean + Barcelona/Sant Cugat inset + Roma stamp) -> timeline -> contact-sheet gallery -> cinema -> quiz -> reasons -> contract -> song -> sealed letter -> vouchers. One printed-paper look on purpose. */
:root {
  --paper: #f6f1e8;
  --paper-2: #efe5d6;
  --card: #fbf8f2;
  --ink: #201917;
  --granat: #92182a;
  --blush: #f3ccc6;
  --mute: #7d7068;
  --sea: #dfe6e3;
  --land: #efe4cf;
  --film: #1c1918;
  --gold: #c8a35e;
  --display: "Gloock", "Bodoni 72", Didot, Georgia, serif;
  --title: "Instrument Serif", Georgia, "Times New Roman", serif;
  --num: "Italiana", "Instrument Serif", Georgia, serif;
  --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --hand: "Nothing You Could Do", "Segoe Print", cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--paper); }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; margin: 0; }
button { font: inherit; color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); }
.kicker { font: 700 .72rem/1 var(--sans); letter-spacing: .28em; text-transform: uppercase; color: var(--granat); margin: 0; }
h2 { font: 400 clamp(2.4rem, 7vw, 4.4rem)/1 var(--title); margin: .3em 0 .25em; text-wrap: balance; }
h2 em { font-style: italic; }
.lead { font: italic 400 clamp(1.1rem, 2.3vw, 1.3rem)/1.45 var(--title); color: var(--mute); max-width: 52ch; margin: 0; }
section { padding-block: clamp(56px, 9vw, 104px); }
:focus-visible { outline: 2px solid var(--granat); outline-offset: 3px; }
.btn { display: inline-flex; align-items: center; gap: 10px; background: var(--ink); color: var(--paper); border: 0; border-radius: 999px; padding: 13px 22px; font: 700 .76rem/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--granat); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px currentColor; }
.btn.ghost:hover { color: var(--granat); background: transparent; }

/* ---------- gate ---------- */
#gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--paper); }
#gate .box { width: min(460px, 100%); text-align: center; display: grid; gap: 18px; }
#gate .mast { font: 400 clamp(3.8rem, 18vw, 7rem)/.9 var(--display); color: var(--granat); margin: 0; }
#gate .sub { font: 600 .7rem/1.6 var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--mute); margin: 0; }
#gate .seal { width: 92px; height: 92px; margin: 6px auto 0; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #b8323f, #7a0f1f 70%); color: #f7c9c3; font: 400 1.5rem/1 var(--display); box-shadow: 0 8px 18px rgba(80,10,20,.3); }
#gate form { display: grid; gap: 12px; }
#gate input { width: 100%; padding: 15px 18px; border-radius: 999px; border: 1px solid #d3c4b0; background: var(--card); font: 400 1.15rem/1 var(--title); text-align: center; color: var(--ink); }
#gate .hint { font: italic 400 1.05rem/1.3 var(--title); color: var(--mute); margin: 0; }
#gate .err { color: var(--granat); font: 600 .85rem/1.3 var(--sans); min-height: 1.3em; margin: 0; }
#gate .note { font: 400 .78rem/1.5 var(--sans); color: var(--mute); margin: 8px 0 0; }

/* ---------- cover ---------- */
.cover { position: relative; min-height: min(92vh, 980px); display: grid; overflow: hidden; background: var(--film); color: #fffaf3; }
.cover .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(20,14,12,.8) 100%); pointer-events: none; }
.cover-in { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: space-between; padding-block: 20px 40px; }
.issue { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font: 600 .7rem/1 var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--ink); }
.cover .mast { font: 400 clamp(4.2rem, 19vw, 13.5rem)/.86 var(--display); color: var(--granat); margin: 10px 0 0; text-align: center; }
.forher { font: 400 clamp(1.3rem, 3.6vw, 2.2rem)/1 var(--hand); color: var(--granat); transform: rotate(-4deg); align-self: flex-end; margin: 4px 4% 0 0; }
.names { font: 400 clamp(3rem, 11vw, 7rem)/.92 var(--title); margin: 0; }
.names em { font-style: italic; }
.dek { font: italic 400 clamp(1.05rem, 2.4vw, 1.35rem)/1.4 var(--title); max-width: 40ch; margin: 14px 0 0; color: #f3e9dc; }
.toc { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.toc a { color: #fffaf3; text-decoration: none; font: 700 .68rem/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; padding: 9px 13px; border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(255,250,243,.5); }
.toc a:hover { background: rgba(255,250,243,.15); }

/* ---------- counter ---------- */
.counter { background: var(--granat); color: #fbf3ea; }
.counter .wrap { display: grid; gap: 28px; }
.counter .kicker { color: var(--blush); }
.clock { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.unit { border-top: 1px solid rgba(251,243,234,.4); padding-top: 12px; }
.unit b { display: block; font: 400 clamp(2.4rem, 8vw, 5.4rem)/1 var(--num); font-variant-numeric: tabular-nums; }
.unit span { font: 700 .66rem/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--blush); }
.next { font: italic 400 clamp(1.15rem, 2.6vw, 1.5rem)/1.4 var(--title); margin: 0; }
.next strong { font-style: normal; font-family: var(--num); font-size: 1.3em; }

/* ---------- map ---------- */
.maps { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 22px; margin-top: 34px; align-items: start; }
.mapcard { background: var(--card); border: 1px solid #e3d6c4; border-radius: 6px; padding: 10px; position: relative; }
.mapcard .tag { position: absolute; top: 18px; left: 22px; font: 700 .64rem/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--mute); }
.mapcard svg { width: 100%; height: auto; display: block; }
.pin { cursor: pointer; }
.pin circle.dot { fill: var(--granat); stroke: var(--card); stroke-width: 3; transition: r .15s; }
.pin path.heart { fill: var(--granat); stroke: var(--card); stroke-width: 2.5; }
.pin text { font: 600 17px var(--sans); fill: var(--ink); paint-order: stroke; stroke: var(--card); stroke-width: 5px; stroke-linejoin: round; }
.pin text.date { font: italic 400 15px var(--title); fill: var(--mute); }
.pin:hover circle.dot, .pin:focus circle.dot { r: 11; }
.pin:hover text.name, .pin:focus text.name { fill: var(--granat); }
.pin:focus { outline: none; }
.pin:focus-visible circle.dot { stroke: var(--ink); }
.zone { fill: none; stroke: var(--granat); stroke-width: 1.5; stroke-dasharray: 5 5; cursor: pointer; }
.maplist { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.maplist button { background: var(--card); border: 1px solid #e3d6c4; border-radius: 999px; padding: 8px 14px; cursor: pointer; font: 600 .82rem/1 var(--sans); }
.maplist button:hover { border-color: var(--granat); color: var(--granat); }
.maplist button small { font: italic 400 .9rem var(--title); color: var(--mute); margin-left: 6px; }

/* ---------- timeline ---------- */
.tl { list-style: none; margin: 32px 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px; }
.tl li { display: grid; gap: 8px; align-content: start; min-width: 0; }
.arch { aspect-ratio: 3 / 4.2; border-radius: 999px 999px 4px 4px; overflow: hidden; background: var(--paper-2); max-width: 100%; }
.arch img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tl time { font: 400 1.7rem/1 var(--num); color: var(--granat); margin-top: 8px; }
.tl b { font: 700 .7rem/1.2 var(--sans); letter-spacing: .16em; text-transform: uppercase; }
.tl p { margin: 0; font: italic 400 1.02rem/1.35 var(--title); color: var(--mute); }

/* ---------- gallery ---------- */
.sheet { background: var(--film); color: #f4ede3; }
.sheet .kicker { color: #e8a65c; }
.sheet .lead { color: #c9bfb3; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
.tabs button { background: transparent; border: 0; box-shadow: inset 0 0 0 1px rgba(244,237,227,.35); color: #f4ede3; border-radius: 999px; padding: 9px 15px; cursor: pointer; font: 700 .7rem/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; }
.tabs button[aria-pressed="true"] { background: #f4ede3; color: var(--film); }
.tabs button span { font-family: var(--num); letter-spacing: 0; margin-left: 6px; }
.gsub { font: italic 400 1.1rem var(--title); color: #c9bfb3; margin: 18px 0 0; }
.grid { columns: 4 200px; column-gap: 12px; margin-top: 22px; }
.grid figure { break-inside: avoid; margin: 0 0 12px; background: #f6f1e8; padding: 6px 6px 8px; border-radius: 2px; transform: rotate(var(--r, 0deg)); transition: transform .25s ease; }
.grid figure:hover { transform: rotate(0) scale(1.015); }
.grid button { all: unset; cursor: zoom-in; display: block; width: 100%; }
.grid button:focus-visible { outline: 2px solid #e8a65c; outline-offset: 4px; }
.ph { display: block; width: 100%; height: auto; background: #d9cfc2; aspect-ratio: var(--ar, 3/4); object-fit: cover; }

/* ---------- cinema ---------- */
.cinema { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); gap: 14px; margin-top: 30px; }
.reel { position: relative; aspect-ratio: 9 / 14; border-radius: 6px; overflow: hidden; background: var(--film); cursor: pointer; border: 0; padding: 0; }
.reel img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .9; }
.reel::after { content: "▶"; position: absolute; inset: auto 12px 12px auto; width: 44px; height: 44px; border-radius: 50%; background: var(--paper); color: var(--granat); display: grid; place-items: center; font-size: 15px; padding-left: 3px; }
.reel span { position: absolute; left: 12px; top: 10px; font: 400 1.4rem var(--num); color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.5); }

/* ---------- quiz ---------- */
.quiz { background: var(--paper-2); }
.qbox { max-width: 720px; margin-top: 30px; background: var(--card); border: 1px solid #e3d6c4; border-radius: 8px; padding: clamp(20px, 4vw, 36px); }
.qtop { display: flex; justify-content: space-between; gap: 12px; font: 700 .7rem/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--mute); }
.qbar { height: 4px; background: #eadfce; border-radius: 4px; margin: 12px 0 22px; overflow: hidden; }
.qbar i { display: block; height: 100%; background: var(--granat); transition: width .3s; }
.qq { font: 400 clamp(1.6rem, 4vw, 2.3rem)/1.15 var(--title); margin: 0 0 20px; text-wrap: balance; }
.qopts { display: grid; gap: 10px; }
.qopts button { text-align: left; background: var(--paper); border: 1px solid #e3d6c4; border-radius: 10px; padding: 14px 16px; cursor: pointer; font: 600 1rem/1.3 var(--sans); display: flex; gap: 12px; align-items: center; }
.qopts button b { font: 400 1.2rem var(--num); color: var(--granat); width: 1.2em; }
.qopts button:hover:not(:disabled) { border-color: var(--granat); }
.qopts button.ok { background: #e4efe3; border-color: #3f7a4a; }
.qopts button.ko { background: #f7e1df; border-color: var(--granat); }
.qopts button:disabled { cursor: default; }
.qexp { font: italic 400 1.15rem/1.4 var(--title); color: var(--mute); min-height: 1.5em; margin: 16px 0; }
.qend { text-align: center; }
.qend .score { font: 400 clamp(4rem, 14vw, 7rem)/1 var(--num); color: var(--granat); margin: 0; }

/* ---------- reasons ---------- */
.rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 14px; margin-top: 30px; }
.rcard { perspective: 900px; aspect-ratio: 4 / 3.2; border: 0; padding: 0; background: none; cursor: pointer; }
.rin { position: relative; width: 100%; height: 100%; transition: transform .6s; transform-style: preserve-3d; }
.rcard[aria-pressed="true"] .rin { transform: rotateY(180deg); }
.rf, .rb { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 8px; display: grid; place-items: center; padding: 18px; text-align: center; }
.rf { background: var(--granat); color: var(--blush); }
.rf b { display: block; font: 400 3.4rem/1 var(--num); color: #fff; }
.rf small { font: 700 .66rem/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; }
.rb { background: var(--card); border: 1px solid #e3d6c4; transform: rotateY(180deg); font: italic 400 1.2rem/1.35 var(--title); color: var(--ink); }

/* ---------- contract ---------- */
.doc { max-width: 760px; margin: 30px auto 0; background: #fffdf8; border: 1px solid #e1d3bf; padding: clamp(22px, 5vw, 56px); box-shadow: 0 18px 40px rgba(60,40,30,.1); position: relative; }
.doc h3 { font: 400 clamp(1.8rem, 5vw, 2.6rem)/1.05 var(--display); text-align: center; margin: 0; color: var(--granat); }
.doc .parts { text-align: center; font: italic 400 1.1rem/1.4 var(--title); color: var(--mute); margin: 10px 0 26px; }
.doc ol { margin: 0; padding: 0; list-style: none; counter-reset: c; display: grid; gap: 14px; }
.doc li { counter-increment: c; display: grid; grid-template-columns: 4.6em minmax(0, 1fr); gap: 10px; font: 400 1.08rem/1.5 var(--title); }
.doc li::before { content: "Cl. " counter(c); font: 700 .72rem/2 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--granat); }
.doc li b { font: 700 .74rem var(--sans); letter-spacing: .14em; text-transform: uppercase; display: block; }
.sigs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; margin-top: 34px; }
.sig { display: grid; gap: 8px; }
.sig .line { border-bottom: 1px solid var(--ink); height: 110px; display: grid; align-items: end; position: relative; }
.sig .pau { font: 400 2.6rem/1 var(--hand); color: var(--granat); padding-bottom: 6px; }
.sig canvas { width: 100%; height: 110px; touch-action: none; cursor: crosshair; display: block; }
.sig small { font: 700 .66rem/1.3 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--mute); display: flex; justify-content: space-between; gap: 8px; }
.sig small button { background: none; border: 0; padding: 0; font: inherit; color: var(--granat); cursor: pointer; letter-spacing: .14em; }
.stamp { position: absolute; right: 6%; bottom: 120px; transform: rotate(-12deg); border: 3px solid var(--granat); color: var(--granat); border-radius: 8px; padding: 8px 14px; font: 700 .8rem/1.2 var(--sans); letter-spacing: .2em; text-transform: uppercase; text-align: center; background: rgba(255,253,248,.85); }

/* ---------- song + letter ---------- */
.song .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: center; }
.tape { aspect-ratio: 16 / 10.4; max-width: 100%; background: #2a2527; border-radius: 22px; padding: 6%; position: relative; box-shadow: 0 18px 40px rgba(40,24,20,.25); transform: rotate(-3deg); }
.tape .label { background: #f4e8d2; border-radius: 8px; height: 62%; position: relative; overflow: hidden; }
.tape .label::before { content: "A"; position: absolute; inset: 0 0 auto 0; height: 24%; background: var(--granat); color: #fff; font: 700 .9rem/1 var(--sans); display: flex; align-items: center; padding-left: 4%; }
.tape .label span { position: absolute; top: 36%; left: 0; right: 0; text-align: center; font: 400 clamp(1rem, 3vw, 1.6rem)/1 var(--hand); color: var(--ink); }
.tape .win { position: absolute; left: 26%; right: 26%; top: 49%; height: 13%; background: #1a1718; border-radius: 99px; display: flex; justify-content: space-between; align-items: center; padding: 0 6%; }
.spool { width: 22%; aspect-ratio: 1; border-radius: 50%; border: 5px dotted #f4e8d2; animation: spin 4s linear infinite; animation-play-state: var(--play, paused); }
@keyframes spin { to { transform: rotate(360deg); } }
.song p { font: italic 400 1.25rem/1.45 var(--title); margin: 0 0 22px; max-width: 34ch; }
.letter { background: var(--paper-2); }
.env { max-width: 640px; margin: 28px auto 0; background: var(--card); border: 1px solid #e3d6c4; padding: clamp(24px, 6vw, 56px); box-shadow: 0 16px 40px rgba(60,40,30,.12); }
.lacre { border: 0; cursor: pointer; display: grid; place-items: center; width: 132px; aspect-ratio: 1; margin: 6px auto 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #b8323f, #7a0f1f 70%); color: #f7c9c3; font: 400 2rem/1 var(--display); box-shadow: 0 8px 18px rgba(80,10,20,.35); }
.hint2 { text-align: center; font: 700 .7rem/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--mute); margin-top: 16px; }
.msg p { font: 400 1.2rem/1.6 var(--title); margin: 0 0 1em; }
.msg .signa { font: 400 2.6rem/1 var(--hand); color: var(--granat); margin: 10px 0 18px; }
.vals { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 36px; align-items: center; }
.vals p { font: italic 400 1.25rem/1.45 var(--title); margin: 0; max-width: 36ch; }
.stub { background: var(--card); border: 2px dashed var(--granat); padding: 22px 24px; transform: rotate(2deg); }
.stub b { display: block; font: italic 400 1.9rem/1.05 var(--title); margin: 6px 0; }
.stub small { font: 600 .72rem/1.3 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
footer { border-top: 1px solid #d8cbb9; padding-block: 36px 48px; text-align: center; }
footer .m { font: 400 2.6rem/1 var(--display); color: var(--granat); }
footer p { margin: 8px 0 0; font: 600 .7rem/1.4 var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--mute); }
footer button { margin-top: 18px; }

/* ---------- viewer ---------- */
.viewer { position: fixed; inset: 0; z-index: 20; background: rgba(18,14,13,.95); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px); color: #f4ede3; }
.vhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; padding: 4px 6px 12px; max-width: 1100px; width: 100%; margin: 0 auto; }
.vhead h3 { font: 400 clamp(1.6rem, 4vw, 2.4rem)/1 var(--title); margin: 0; }
.vhead p { margin: 6px 0 0; font: italic 400 1.1rem/1.35 var(--title); color: #d8cdbf; max-width: 60ch; }
.vhead .d { font: 700 .66rem/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: #e8a65c; }
.vclose { background: none; border: 1px solid rgba(244,237,227,.4); color: #f4ede3; border-radius: 999px; padding: 9px 15px; cursor: pointer; font: 700 .7rem/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; flex: none; }
.vstage { position: relative; display: grid; place-items: center; min-height: 0; }
.vstage { overflow: hidden; }
.vstage img, .vstage video { max-width: 100%; max-height: calc(100vh - 230px); object-fit: contain; border-radius: 3px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.vstage .load { font: italic 400 1.2rem var(--title); color: #c9bfb3; }
.vnav { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(244,237,227,.92); color: var(--ink); font-size: 20px; cursor: pointer; }
.vnav.p { left: 4px; } .vnav.n { right: 4px; }
.vfoot { display: flex; gap: 6px; overflow-x: auto; padding: 12px 6px 2px; max-width: 1100px; width: 100%; margin: 0 auto; scrollbar-width: thin; }
.vfoot button { flex: none; width: 54px; height: 54px; border-radius: 4px; overflow: hidden; border: 2px solid transparent; padding: 0; background: #3a3331; cursor: pointer; position: relative; }
.vfoot button[aria-current="true"] { border-color: #e8a65c; }
.vfoot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vfoot button.isv::after { content: "▶"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 13px; text-shadow: 0 0 6px #000; }
.vcount { text-align: center; font: 400 1rem var(--num); color: #c9bfb3; padding-top: 6px; }

@media (max-width: 860px) {
  .maps { grid-template-columns: minmax(0, 1fr); }
  .tl { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .song .wrap, .vals, .sigs { grid-template-columns: minmax(0, 1fr); }
  .clock { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stamp { bottom: 260px; }
}
@media (prefers-reduced-motion: reduce) { .spool { animation: none; } .rin, .grid figure { transition: none; } }
</style>
</head>
<body>


<div id="gate">
  <div class="box">
    <p class="sub">Nº 01 · Edició digital · Accés restringit</p>
    <h1 class="mast">GEORPAU</h1>
    <div class="seal" aria-hidden="true">G&amp;P</div>
    <form id="gform" autocomplete="off">
      <label for="pw" class="hint">Contrasenya. Pista: què som?</label>

      '<div><p class="kicker">Cara A</p><h2 id="t-song">La nostra <em>cançó</em></h2><p>Posa-la de fons mentre passes les pàgines. Ja saps quina és.</p><a class="btn" id="play" href="https://open.spotify.com/search/Ceilings%20Lizzy%20McAlpine" target="_blank" rel="noopener">Escolta Ceilings</a></div></div></section>');
    h.push('<section class="letter" id="carta" aria-labelledby="t-carta"><div class="wrap"><p class="kicker" style="text-align:center">Correspondència privada</p><h2 id="t-carta" style="text-align:center">Per a tu, <em>Georgina</em></h2><div class="env">' +
      '<div id="sealed"><button class="lacre" id="lacre" aria-expanded="false" aria-controls="msg">G&amp;P</button><p class="hint2">Trenca el lacre</p></div>' +
      '<div class="msg" id="msg" hidden><p>Si has arribat fins aquí és que has trobat el codi amagat a la revista. Benvinguda a la part secreta de GEORPAU.</p>' +
      '<p>Fa tres anys que el rellotge d’aquesta pàgina va començar a comptar, però jo ja t’estimava des de les passejades de primer de primària. Gràcies per Roma, per totes les rialles, per explicar-me cada història amb tots els detalls i per fer que cada dia sembli un número especial.</p>' +
      '<p>T’estimo infinit elevat a infinit, infinites vegades.</p><p class="signa">Pau</p><button class="btn" id="audbtn" type="button">▶ Escolta el missatge del Pau</button></div></div></div></section>');
    h.push('<section aria-labelledby="t-vals"><div class="wrap vals"><div><p class="kicker">Propers capítols</p><h2 id="t-vals">Tens <em>vals</em> per gastar</h2><p>Són a la caixa, al costat de la revista. Cada un es pot bescanviar quan vulguis. Sense data de caducitat.</p></div>' +
      '<div class="stub" aria-hidden="true"><small>Val Nº 01 · Vàlid per a la Georgina</small><b>Un dinar al Machiroku</b><small>Com la primera vegada</small></div></div></section>');
    h.push('<footer><div class="m">GEORPAU</div><p>Nº 01 · Exemplar únic · Fet a Barcelona amb molt d’amor</p><button class="btn ghost" id="lock" type="button">Tancar amb clau</button></footer>');
    A.innerHTML = h.join('');

    url(D.cover).then(function (u) { $('#coverimg').src = u; });
    counter(); setInterval(counter, 1000);

    // map interactions
    var byId = {}; D.places.forEach(function (p) { byId[p.id] = p; });
    function openPlace(id) { var p = byId[id]; if (p) openViewer(p.m, 0, p); }
    Array.prototype.forEach.call(document.querySelectorAll('.pin'), function (g) {
      g.addEventListener('click', function () { openPlace(g.dataset.p); });
      g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPlace(g.dataset.p); } });
    });
    var z = $('.zone'); var goB = function () { $('#bcnmap').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
    z.addEventListener('click', goB); z.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goB(); } });
    var ml = $('#maplist');
    D.places.forEach(function (p) {
      var b = document.createElement('button'); b.innerHTML = esc(p.n) + '<small>' + p.m.length + '</small>'; b.setAttribute('aria-label', p.n + ', ' + p.m.length + ' fotos i vídeos');
      b.onclick = function () { openPlace(p.id); }; ml.appendChild(b);
    });

    // timeline
    var tl = $('#tl');
    D.timeline.forEach(function (e) {
      var li = document.createElement('li'), a = document.createElement('div'); a.className = 'arch';
      var im = imgEl(e.m, '', e.t); im.style.aspectRatio = 'auto'; a.appendChild(im); li.appendChild(a);
      li.insertAdjacentHTML('beforeend', '<time>' + esc(e.d) + '</time><b>' + esc(e.t) + '</b><p>' + esc(e.s) + '</p>'); tl.appendChild(li);
    });

    // gallery
    var tabs = $('#tabs');
    D.gallery.forEach(function (g, k) {
      var b = document.createElement('button'); b.innerHTML = esc(g.n) + '<span>' + g.m.length + '</span>'; b.setAttribute('aria-pressed', k === 0 ? 'true' : 'false');
      b.onclick = function () { Array.prototype.forEach.call(tabs.children, function (x) { x.setAttribute('aria-pressed', 'false'); }); b.setAttribute('aria-pressed', 'true'); showGal(g); };
      tabs.appendChild(b);
    });
    showGal(D.gallery[0]);

    // cinema
    var cin = $('#cin');
    D.cinema.forEach(function (id, k) {
      var b = document.createElement('button'); b.className = 'reel'; b.setAttribute('aria-label', 'Reprodueix el vídeo ' + (k + 1));
      b.appendChild(imgEl(id, '', '')); b.insertAdjacentHTML('beforeend', '<span>' + String(k + 1).padStart(2, '0') + '</span>');
      b.onclick = function () { openViewer(D.cinema, k, { n: 'Cinema GEORPAU', d: 'Sessió contínua', s: '' }); }; cin.appendChild(b);
    });

    quiz(); reasons(); contract(); letter();
    $('#play').addEventListener('click', function () { $('#tape').style.setProperty('--play', 'running'); });
    $('#lock').onclick = function () { try { localStorage.removeItem('gp_pw'); } catch (e) {} location.reload(); };
  }

  function showGal(g) {
    $('#gsub').textContent = g.s; var grid = $('#grid'); grid.innerHTML = '';
    g.m.forEach(function (id, k) {
      var f = document.createElement('figure'); f.style.setProperty('--r', (((k * 37) % 7) - 3) * 0.45 + 'deg');
      var b = document.createElement('button'); b.setAttribute('aria-label', 'Amplia la foto ' + (k + 1)); b.appendChild(imgEl(id));
      b.onclick = function () { openViewer(g.m, k, { n: g.n, s: g.s, d: (k + 1) + ' de ' + g.m.length }); };
      f.appendChild(b); grid.appendChild(f);
    });
  }

  function counter() {
    var start = new Date(2023, 11, 18), now = new Date(), ms = Math.max(0, now - start);
    var pad = function (n) { return String(n).padStart(2, '0'); };
    $('#cd').textContent = Math.floor(ms / 864e5).toLocaleString('ca-ES'); $('#ch').textContent = pad(Math.floor(ms / 36e5) % 24);
    $('#cm').textContent = pad(Math.floor(ms / 6e4) % 60); $('#cs').textContent = pad(Math.floor(ms / 1e3) % 60);
    var y = now.getFullYear(), today = new Date(y, now.getMonth(), now.getDate()), ann = new Date(y, 11, 18);
    var el = $('#nextday');
    if (+today === +ann) el.innerHTML = 'Avui fem <strong>' + (y - 2023) + '</strong> anys junts. Felicitats, amor.';
    else { if (today > ann) ann = new Date(y + 1, 11, 18); el.innerHTML = 'Falten <strong>' + Math.round((ann - today) / 864e5) + '</strong> dies per fer ' + (ann.getFullYear() - 2023) + ' anys junts.'; }
  }

  function quiz() {
    var box = $('#qbox'), i = 0, score = 0, Q = D.quiz;
    function q() {
      if (i >= Q.length) return end();
      var it = Q[i], h = '<div class="qtop"><span>Pregunta ' + (i + 1) + ' de ' + Q.length + '</span><span>' + score + ' encerts</span></div><div class="qbar"><i style="width:' + (i / Q.length * 100) + '%"></i></div><p class="qq">' + esc(it.q) + '</p><div class="qopts">';
      it.a.forEach(function (a, k) { h += '<button type="button" data-k="' + k + '"><b>' + 'ABCD'[k] + '</b>' + esc(a) + '</button>'; });
      box.innerHTML = h + '</div><p class="qexp" id="qexp"></p><button class="btn" id="qnext" type="button" hidden>Següent</button>';
      Array.prototype.forEach.call(box.querySelectorAll('.qopts button'), function (b) {
        b.onclick = function () {
          var k = +b.dataset.k, ok = k === it.k; if (ok) score++;
          Array.prototype.forEach.call(box.querySelectorAll('.qopts button'), function (x) { x.disabled = true; if (+x.dataset.k === it.k) x.classList.add('ok'); });
          if (!ok) b.classList.add('ko');
          $('#qexp').textContent = (ok ? 'Correcte. ' : 'Gairebé. ') + it.e; var n = $('#qnext'); n.hidden = false; n.textContent = i === Q.length - 1 ? 'Veure el resultat' : 'Següent'; n.focus();
          n.onclick = function () { i++; q(); };
        };
      });
    }
    function end() {
      var msg = score === Q.length ? 'Puntuació perfecta. Em coneixes millor que jo mateix.' : score >= 7 ? 'Molt bé. Ets oficialment experta en Pau.' : score >= 4 ? 'No està malament, però caldrà fer més cites d’estudi.' : 'Hmm. Proposo una escapada intensiva per repassar.';
      box.innerHTML = '<div class="qend"><p class="kicker">Resultat</p><p class="score">' + score + '/' + Q.length + '</p><p class="qexp">' + msg + '</p><button class="btn" id="qagain" type="button">Tornar a jugar</button></div>';
      $('#qagain').onclick = function () { i = 0; score = 0; q(); };
    }
    q();
  }

  function reasons() {
    var g = $('#rgrid');
    D.reasons.forEach(function (r, k) {
      var b = document.createElement('button'); b.className = 'rcard'; b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', 'Raó ' + (k + 1) + '. ' + r);
      b.innerHTML = '<div class="rin"><div class="rf"><div><b>' + String(k + 1).padStart(2, '0') + '</b><small>Gira la carta</small></div></div><div class="rb">' + esc(r) + '</div></div>';
      b.onclick = function () { b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); }; g.appendChild(b);
    });
  }

  function contract() {
    var ol = $('#clauses');
    D.contract.forEach(function (c) { ol.insertAdjacentHTML('beforeend', '<li><span><b>' + esc(c[0]) + '</b>' + esc(c[1]) + '</span></li>'); });
    var cv = $('#sigpad'), ctx, drawing = false, signed = false;
    function size() {
      var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1, prev = signed ? cv.toDataURL() : null;
      cv.width = r.width * dpr; cv.height = r.height * dpr; ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
      ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#92182a';
      var src = prev; if (!src) { try { src = localStorage.getItem('gp_sig'); } catch (e) {} }
      if (src) { var im = new Image(); im.onload = function () { ctx.drawImage(im, 0, 0, r.width, r.height); }; im.src = src; signed = true; $('#stamp').hidden = false; }
    }
    function pos(e) { var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
    cv.addEventListener('pointerdown', function (e) { drawing = true; cv.setPointerCapture(e.pointerId); var p = pos(e); ctx.beginPath(); ctx.moveTo(p[0], p[1]); });
    cv.addEventListener('pointermove', function (e) { if (!drawing) return; var p = pos(e); ctx.lineTo(p[0], p[1]); ctx.stroke(); });
    var up = function () { if (!drawing) return; drawing = false; signed = true; $('#stamp').hidden = false; try { localStorage.setItem('gp_sig', cv.toDataURL()); } catch (e) {} };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    $('#sigclear').onclick = function () { ctx.clearRect(0, 0, cv.width, cv.height); signed = false; $('#stamp').hidden = true; try { localStorage.removeItem('gp_sig'); } catch (e) {} };
    size(); var t; window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(size, 200); });
  }

  function letter() {
    var lacre = $('#lacre'), audio = null;
    lacre.onclick = function () { $('#sealed').hidden = true; $('#msg').hidden = false; lacre.setAttribute('aria-expanded', 'true'); playAudio(); };
    function playAudio() {
      var b = $('#audbtn'); b.textContent = 'Carregant…';
      url(D.audio).then(function (u) {
        if (!audio) { audio = new Audio(u); audio.onended = function () { b.textContent = '▶ Escolta el missatge del Pau'; }; }
        audio.currentTime = 0; audio.play().then(function () { b.textContent = '■ Atura el missatge'; }, function () { b.textContent = '▶ Escolta el missatge del Pau'; });
      });
    }
    $('#audbtn').onclick = function () { if (audio && !audio.paused) { audio.pause(); this.textContent = '▶ Escolta el missatge del Pau'; } else playAudio(); };
  }
})();
</script>

</body>
</html>
